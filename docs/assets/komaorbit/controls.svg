<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="ko-controls-title ko-controls-desc"><title id="ko-controls-title">KomaOrbit マウス操作</title><desc id="ko-controls-desc">配布コードの操作案内に基づく左ドラッグ・右ドラッグ・ホイールの対応図。</desc><style>text {font-family: Droid Sans Fallback, Yu Gothic, Meiryo, sans-serif;}</style><defs><marker id="ko-controls-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2b8c88"/></marker></defs><rect width="1200" height="640" fill="#f4f8f7"/><text x="48" y="62" font-size="34" fill="#183c40">KomaOrbit｜画像の中でマウスを操作</text><text x="48" y="104" font-size="22" fill="#50676c">Mouse gestures inside the 3D composition viewer</text><path d="M 490 192 L 574 192" stroke="#2b8c88" stroke-width="4" fill="none" data-from="L" data-to="O" marker-end="url(#ko-controls-arrow)"/><g data-node="L"><rect x="48" y="145" width="442" height="102" rx="12" fill="#e1efeb"/><text x="76" y="187" font-size="28" fill="#183c40">左ボタン＋ドラッグ</text><text x="76" y="223" font-size="20" fill="#183c40">Hold left button + drag</text></g><g data-node="O"><rect x="580" y="145" width="572" height="102" rx="12" fill="#ffffff" stroke="#b5cfca"/><text x="610" y="187" font-size="29" fill="#183c40">回転 / Orbit</text><text x="610" y="223" font-size="24" fill="#183c40">左右に一周・上下にアオリ／俯瞰</text></g><path d="M 490 322 L 574 322" stroke="#2b8c88" stroke-width="4" fill="none" data-from="R" data-to="P" marker-end="url(#ko-controls-arrow)"/><g data-node="R"><rect x="48" y="275" width="442" height="102" rx="12" fill="#e1efeb"/><text x="76" y="317" font-size="28" fill="#183c40">右ボタン＋ドラッグ</text><text x="76" y="353" font-size="20" fill="#183c40">Hold right button + drag</text></g><g data-node="P"><rect x="580" y="275" width="572" height="102" rx="12" fill="#ffffff" stroke="#b5cfca"/><text x="610" y="317" font-size="29" fill="#183c40">平行移動 / Pan</text><text x="610" y="353" font-size="24" fill="#183c40">向きを変えずに構図を上下左右へ</text></g><path d="M 490 452 L 574 452" stroke="#2b8c88" stroke-width="4" fill="none" data-from="W" data-to="Z" marker-end="url(#ko-controls-arrow)"/><g data-node="W"><rect x="48" y="405" width="442" height="102" rx="12" fill="#e1efeb"/><text x="76" y="447" font-size="28" fill="#183c40">ホイールを回す</text><text x="76" y="483" font-size="20" fill="#183c40">Scroll the wheel</text></g><g data-node="Z"><rect x="580" y="405" width="572" height="102" rx="12" fill="#ffffff" stroke="#b5cfca"/><text x="610" y="447" font-size="29" fill="#183c40">拡大縮小 / Zoom</text><text x="610" y="483" font-size="24" fill="#183c40">保存する構図に寄る・周囲を広げる</text></g><text x="48" y="590" font-size="25" fill="#183c40">「中央に戻す」で復帰。「この視点を保存」で白枠内をPNG保存。</text><text x="48" y="624" font-size="20" fill="#50676c">Reset to center · Save the white-framed view at the source image dimensions</text></svg>
